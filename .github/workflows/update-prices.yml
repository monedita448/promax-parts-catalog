name: Update parts prices

on:
  schedule:
    - cron: "17 9 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install --with-deps chromium

      - name: Run price check
        id: prices
        env:
          IG_EMAIL: ${{ secrets.IG_EMAIL }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
        run: python scripts/update_prices.py

      - name: Commit status.json and any price changes
        run: |
          git config user.name "price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.js status.json
          if ! git diff --cached --quiet; then
            git commit -m "Price check ($(date -u +%Y-%m-%d), ok=${{ steps.prices.outputs.check_ok }})"
            git push
          else
            echo "Nothing changed, skipping commit."
          fi
