<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fichas Técnicas — Sistemas de Incendio</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { max-width: 100%; overflow-x: hidden; }
  :root {
    --bg: #0d0f14;
    --card: #14171f;
    --border: #232733;
    --input-bg: #1a1d26;
    --text: #f2f3f5;
    --text-muted: #8a8d99;
    --text-faint: #4b4e58;
    --accent: #00e5c7;
    --accent2: #a78bfa;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .flags { display: flex; align-items: center; gap: 8px; font-size: 19px; flex-shrink: 0; }
  .flags span.arrow { color: var(--text-faint); font-size: 14px; }
  .search-box { flex: 1; min-width: 0; }
  .search-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: var(--input-bg);
    color: var(--text);
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: var(--text-faint); }

  main { padding: 16px; max-width: 1000px; margin: 0 auto; }

  .payment-banner {
    background: linear-gradient(135deg, rgba(0,229,199,0.08), rgba(167,139,250,0.08));
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .payment-banner .kicker {
    font-size: 11px; color: var(--accent); text-transform: uppercase;
    letter-spacing: 0.08em; font-weight: 700; margin: 0 0 4px;
  }
  .payment-banner .sub { font-size: 12.5px; color: #c8cad0; margin: 0 0 14px; }
  .payment-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .payment-pill {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 12px; border-radius: 999px;
    background: var(--card); border: 1px solid #2a2f3d;
  }
  .payment-badge {
    width: 20px; height: 20px; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .payment-badge.round { border-radius: 50%; }
  .payment-badge.square { border-radius: 6px; }
  .payment-pill .label { font-size: 12.5px; color: var(--text); font-weight: 600; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px; display: flex; flex-direction: column; cursor: pointer;
    transition: border-color 0.15s;
  }
  .card:active { border-color: var(--accent); }
  .photo {
    width: 100%; aspect-ratio: 1; background: var(--input-bg); border-radius: 10px;
    margin-bottom: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .photo img { width: 100%; height: 100%; object-fit: contain; }
  .badge-pill {
    display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 6px;
    width: fit-content; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.02em;
  }
  .badge-pill.genuine { background: rgba(167,139,250,0.15); color: var(--accent2); }
  .badge-pill.premium { background: rgba(0,229,199,0.12); color: var(--accent); }
  .card .cat-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.04em; margin: 0 0 3px; }
  .card h3 { font-size: 13px; font-weight: 600; margin: 0 0 4px; color: var(--text); line-height: 1.3; }
  .card .colors { font-size: 11px; color: var(--text-muted); margin: 0 0 10px; }
  .card .go-btn {
    margin-top: auto; border-top: 1px solid var(--border); padding-top: 10px;
    display: block; text-align: center; font-size: 12px; font-weight: 600;
    color: var(--bg); padding: 10px 0; background: var(--accent); border-radius: 8px;
  }

  footer { text-align: center; padding: 20px; }
  footer p { font-size: 11px; color: var(--text-faint); margin: 0; }

  #detailView { display: none; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px; background: none; border: none;
    color: var(--accent); font-size: 14px; cursor: pointer; padding: 4px 0 16px; font-weight: 600;
  }
  .detail-head { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
  .detail-photo {
    width: 100%; height: 220px; flex-shrink: 0; background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 14px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .detail-photo img { width: 100%; height: 100%; object-fit: contain; }
  .detail-info h1 { font-size: 17px; margin: 0 0 8px; line-height: 1.3; }
  .detail-info .colors { font-size: 13px; color: var(--text-muted); margin: 0 0 10px; }
  .detail-section {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 14px;
  }
  .detail-section h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--accent); margin: 0 0 12px;
  }
  .detail-section p, .detail-section li { font-size: 13.5px; color: #c8cad0; line-height: 1.6; }
  .detail-section ul { margin: 0; padding-left: 18px; }
  table.spec-table { width: 100%; border-collapse: collapse; }
  table.spec-table td { padding: 8px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  table.spec-table td:first-child { color: var(--text-muted); width: 55%; }
  table.spec-table td:last-child { color: var(--text); font-weight: 600; text-align: right; }
  .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-pill {
    font-size: 12px; padding: 6px 12px; border-radius: 999px;
    background: rgba(167,139,250,0.12); color: var(--accent2); border: 1px solid rgba(167,139,250,0.3);
  }
  .empty-state { display: none; text-align: center; color: var(--text-muted); padding: 30px 0; font-size: 14px; }

  @media (min-width: 640px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
    .detail-head { flex-direction: row; }
    .detail-photo { width: 240px; height: 240px; flex-shrink: 0; }
    .detail-info { flex: 1; }
    .detail-info h1 { font-size: 20px; }
    header { padding: 18px 24px; }
    main { padding: 24px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="flags">🇺🇸 <span class="arrow">→</span> 🇨🇴</div>
    <div class="search-box">
      <input id="searchInput" placeholder="Buscar — ej. gabinete eléctrico, vehículo, DIN rail..." oninput="renderGrid()">
    </div>
  </div>
</header>

<main>

  <div id="gridView">

    <div class="payment-banner">
      <p class="kicker">Métodos de pago aceptados</p>
      <p class="sub">Paga como te resulte más fácil — todos aceptados sin complicaciones.</p>
      <div class="payment-row">
        <div class="payment-pill">
          <span class="payment-badge round" style="background:#f7931a; color:#0d0f14;">₿</span>
          <span class="label">Bitcoin</span>
        </div>
        <div class="payment-pill">
          <span class="payment-badge round" style="background:linear-gradient(135deg,#9945ff,#14f195); color:#0d0f14;">◎</span>
          <span class="label">Solana</span>
        </div>
        <div class="payment-pill">
          <span class="payment-badge round" style="background:#26a17b; color:#0d0f14;">₮</span>
          <span class="label">USDT</span>
        </div>
        <div class="payment-pill">
          <span class="payment-badge square" style="background:#00d64f; color:#0d0f14;">$</span>
          <span class="label">Cash App</span>
        </div>
        <div class="payment-pill">
          <span class="payment-badge round" style="background:#ffd200; color:#0d0f14;">B</span>
          <span class="label">Bancolombia</span>
        </div>
        <div class="payment-pill">
          <span class="payment-badge round" style="background:#ff2b6e; color:#ffffff;">N</span>
          <span class="label">Nequi</span>
        </div>
        <div class="payment-pill">
          <span class="payment-badge round" style="background:#6b6e79; color:#0d0f14;">$</span>
          <span class="label">Efectivo</span>
        </div>
      </div>
    </div>

    <div class="grid" id="productGrid"></div>
    <p class="empty-state" id="emptyState">Ningún producto coincide con esa búsqueda.</p>

  </div>

  <div id="detailView"></div>

</main>

<footer>
  <p>Fichas técnicas para distribuidores autorizados — OverpricedConsultants.com</p>
</footer>

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function normalize(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function renderGrid() {
    var q = normalize(document.getElementById('searchInput').value.trim());
    var grid = document.getElementById('productGrid');
    var html = '';
    var visible = 0;
    PRODUCTS.forEach(function (p) {
      var haystack = normalize(p.name + ' ' + p.brandLabel + ' ' + p.badgeLabel);
      if (q && haystack.indexOf(q) === -1) return;
      visible++;
      html += '<div class="card" onclick="showDetail(\'' + p.id + '\')">' +
        '<div class="photo"><img src="' + p.img + '" alt="' + escapeHtml(p.name) + '"></div>' +
        '<span class="badge-pill ' + p.badgeClass + '">' + escapeHtml(p.badgeLabel) + '</span>' +
        '<p class="cat-label">' + escapeHtml(p.brandLabel) + '</p>' +
        '<h3>' + escapeHtml(p.name) + '</h3>' +
        '<p class="colors">' + escapeHtml(p.tagline) + '</p>' +
        '<span class="go-btn">Ver ficha técnica →</span>' +
        '</div>';
    });
    grid.innerHTML = html;
    document.getElementById('emptyState').style.display = visible === 0 ? 'block' : 'none';
  }

  function showDetail(id) {
    var p = PRODUCTS.find(function (x) { return x.id === id; });
    if (!p) return;
    var notesRows = p.technicalNotes.map(function (n) {
      return '<tr><td>' + escapeHtml(n[0]) + '</td><td>' + escapeHtml(n[1]) + '</td></tr>';
    }).join('');
    var qualityItems = p.qualityStandards.map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join('');
    var issueTags = p.commonIssues.map(function (s) { return '<span class="tag-pill">' + escapeHtml(s) + '</span>'; }).join('');
    var html =
      '<button class="back-btn" onclick="showGrid()">← Volver al catálogo</button>' +
      '<div class="detail-head">' +
        '<div class="detail-photo"><img src="' + p.img + '" alt="' + escapeHtml(p.name) + '"></div>' +
        '<div class="detail-info">' +
          '<span class="badge-pill ' + p.badgeClass + '">' + escapeHtml(p.badgeLabel) + '</span>' +
          '<h1>' + escapeHtml(p.name) + ' — ' + escapeHtml(p.brandLabel) + '</h1>' +
          '<p class="colors">' + escapeHtml(p.tagline) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="detail-section"><h2>Estándares de calidad</h2><ul>' + qualityItems + '</ul></div>' +
      '<div class="detail-section"><h2>Notas técnicas</h2><table class="spec-table">' + notesRows + '</table></div>' +
      '<div class="detail-section"><h2>Problemas comunes que resuelve este producto</h2><div class="tag-row">' + issueTags + '</div></div>';
    document.getElementById('detailView').innerHTML = html;
    document.getElementById('gridView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';
    window.scrollTo(0, 0);
  }

  function showGrid() {
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('gridView').style.display = 'block';
  }

  renderGrid();
</script>
